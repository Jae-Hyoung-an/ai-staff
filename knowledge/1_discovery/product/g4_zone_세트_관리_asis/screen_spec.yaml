screens:

# --- 1. ZONE 판가 요금제 -----------------------------------------
  - id: sales_pricing_list
    title: "ZONE 판가 요금제 목록"
    url: "/zone/sales-pricings"
    query_params: [page, salesPricingName, zoneUuid]
    breadcrumb: ["G4 요금 상품 관리", "ZONE 판가 요금제 관리"]
    header_right: header_right_list
    screenshots: ["07_판가_목록.png", "08_판가_목록_zone드롭다운.png"]
    search_fields:
      - { name: ZONE, type: custom_select, default: 전체, options_ref: zone_options }
      - { name: 요금제명, type: text, placeholder: "요금제명으로 검색", default: "" }
      - { name: (검색), type: icon_button, icon: magnifier, style: "파란 pill", align: right }
    table_columns:
      - { name: 요금제 코드, align: left, format: "YYYYMM-SP###" }
      - { name: 요금제명, align: left }
      - { name: 기본판가, align: right, display: "2줄: {N}원 / (VAT {N}원)" }
      - { name: 상태, align: left, values: ["○ 활성", "— 비활성"] }
      - { name: 요금제 설명, align: left, empty_value: "" }
      - { name: 대상 ZONE, align: right, template: "{N}개", issue: "B-1 항상 0개" }
    footer: { left: "+ 추가", center: pagination, right: "총 {N}개" }

  - id: sales_pricing_detail
