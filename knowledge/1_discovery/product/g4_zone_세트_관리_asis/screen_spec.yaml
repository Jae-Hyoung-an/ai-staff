      - { name: 존, empty_value: "-", issue: "ZONE/Zone/존 3가지 표기 혼재" }
      - { name: 벤더장, empty_value: "" }
      - { name: 등록일, format: "YYYY-MM-DD" }
    footer: { left: "+ 추가", center: pagination, right: "총 {N}건" }
    missing_columns: ["계약 종료일 → I-3"]

  - id: vendor_detail
    title: "벤더 조회"
    title_note: "벤더명이 붙지 않음 (G4 메뉴들은 '- {이름}' 형식)"
    url: "/vendor/vendors/{id}"
    breadcrumb: ["세트 관리", "벤더 관리", "벤더 조회"]
    header_right:
      type: meta_line
      value: "● 필수 입력 사항 | 등록: {YYYY-MM-DD HH:mm} | 등록자: {등록자}"
    tabs:
      - { id: basic, label: "기본정보", default: true }
      - { id: riders, label: "소속기사" }
      - { id: history, label: "변경 이력" }
    screenshots: ["27_벤더_조회_기본정보.png", "28_벤더_조회_소속기사.png", "29_벤더_조회_변경이력.png"]
    tab_basic:
      sections: [business_info_detail, settlement_info_detail, contract_info,
                 vendor_zone, vendor_owner, attachments_detail]
      footer_buttons:
        - { label: "운영 중지", style: primary, align: left }
        - { label: "해지", style: danger, align: left }
        - { label: "목록으로", style: secondary }
        - { label: "저장", style: primary }
      footer_issue: "대기→운영중 전이 버튼 없음 → Q-8"
    tab_riders:
      sections: [rider_register, rider_list]
    tab_history:
      section: vendor_change_history

  - id: vendor_create
    title: "벤더 등록"
    url: "/vendor/vendors/add"
    breadcrumb: ["세트 관리", "벤더 관리", "벤더 추가"]
    breadcrumb_issue: "breadcrumb '추가' vs H1 '등록'"
    screenshots: ["30_벤더_등록.png"]
    tabs: "조회와 동일 3개 노출 (아직 없는 벤더의 기사/이력)"
    sections: [business_info_create, settlement_info_create, contract_info,
               vendor_owner_create, attachments_create]
    sections_absent: [vendor_zone]
    sections_absent_issue: "등록 화면에 소속 Zone 섹션이 없음 → Q-7"
    footer_buttons:
      - { label: "목록으로", style: secondary }
      - { label: "저장", style: primary }

# --- 7. 세트분배 관리 --------------------------------------------
  - id: set_allocation_list
    title: "세트분배 관리"
    title_note: "목록 화면인데 '목록'이 안 붙음"
    url: "/vendor/set-allocations"
    query_params: [page, zoneName]
    breadcrumb: ["세트 관리", "세트분배 관리"]
    header_right: header_right_list
    screenshots: ["31_세트분배_목록.png"]
    search_fields:
      - { name: Zone 이름, type: text, placeholder: "Zone 이름 검색" }
    table_columns:
      - { name: Zone 이름 }
      - { name: 연결 벤더 수, template: "{N}개" }
      - { name: 수행 세트 수, template: "{N}개" }
    footer: { left: null, center: pagination, right: "총 {N}건" }
    footer_note: "추가 버튼 없음 — ZONE 생성 시 레코드 자동 생성 (행 수 = ZONE 수)"
    sort: "ZONE명 가나다순"

  - id: set_allocation_detail
    title: "세트분배 관리 - {Zone명}"
    url: "/vendor/set-allocations/{zone_uuid}"
    identifier: uuid
    breadcrumb: ["세트 관리", "세트분배 관리", "세트분배 조회"]
    tabs:
      - { id: basic, label: "기본정보", default: true }
      - { id: history, label: "변경 이력" }
    screenshots: ["32_세트분배_상세_성북1.png", "35_세트분배_상세_동대문1.png",
                  "33_세트분배_변경이력.png"]
    tab_basic:
      sections: [set_alloc_basic_info, vendor_composition]
      footer_buttons:
        - { label: "목록으로", style: secondary }
        - { label: "예약 저장", style: secondary }
        - { label: "저장", style: primary }
    tab_history:
      section: set_alloc_change_history
      footer_buttons:
        - { label: "목록으로", style: secondary }

# ===============================================================
# 섹션 정의
# ===============================================================
sections:

# --- 판가/원가 공통 ----------------------------------------------
  basic_info_pricing:
    title: "기본 정보"
    fields:
      - { name: 요금제명, type: text, required: true, default_on_create: "" }
      - { name: 요금제 설명, type: textarea, required: false,
          placeholder: "100자 이내", maxlength: 100, default_on_create: "" }
    validation:
      - { field: 요금제명, valid: "올바른 요금제명입니다.", empty: "요금제명은 필수 입력값입니다." }

  fee_info_sales:
    title: "요금 정보"
    fields:
      - { name: "기본 판가 (VAT 미포함)", type: text, required: true,
          thousand_separator: true, vat_badge: true, default_on_create: 0 }
    validation:
      - { field: "기본 판가 (VAT 미포함)", valid: "올바른 기본 판가 (VAT 미포함)입니다.",
          range_error: "금액은 1원이상 10만원 이하로 입력해주세요." }
    sub_blocks: [distance_fee_rows, fee_summary_sales]

  fee_info_cost:
    title: "요금 정보"
    layout: "2열 그리드 (라이더비만 3행 단독)"
    fields:
      - { name: "관제비 (VAT 미포함)", type: text, required: false, vat_badge: true, default_on_create: 0, grid: "1행 좌" }
      - { name: "관리비 (VAT 미포함)", type: text, required: false, vat_badge: true, default_on_create: 0, grid: "1행 우" }
      - { name: "픽업비 (VAT 미포함)", type: text, required: false, vat_badge: true, default_on_create: 0, grid: "2행 좌" }
      - { name: "완료비 (VAT 미포함)", type: text, required: false, vat_badge: true, default_on_create: 0, grid: "2행 우" }
      - { name: "라이더비 (기본원가, VAT 미포함)", type: text, required: true, vat_badge: true, default_on_create: 0, grid: "3행 단독" }
    sub_blocks: [distance_fee_rows, fee_summary_cost]

  distance_fee_rows:
    type: h4_block
    title: "거리별 요금"
    repeatable: true
    default_row_count_on_create: 0
    row_layout: "[구간 시작(㎞)] 이상 → [구간 끝(㎞)] 미만 → [요금제▾] [단위거리] [요금(원) (VAT 미포함)] [−] [+]"
    fixed_texts: { after_start: "이상", after_end: "미만", between: "→" }
    fields:
      - { name: "구간 시작(㎞)", required: true, type: text, disabled: true,
          value_rule: "첫 행 0, 이후 행은 직전 행의 구간 끝 자동 승계" }
      - { name: "구간 끝(㎞)", required: true, type: text, maxlength: 6,
          placeholder: "구간 시작 초과", editable: true }
      - { name: 요금제, required: true, type: custom_select, options: [정액제, 거리별] }
      - { name: 단위거리, required: true, type: text, maxlength: 6,
          disabled_when: "요금제 == 정액제", disabled_value: 0 }
      - { name: "요금(원) (VAT 미포함)", required: true, type: text }
    row_actions:
      - { label: "−", style: "빨간 원형 아이콘", action: 행 삭제, exists_on: 모든 행 }
      - { label: "+", style: "빨간 원형 아이콘", action: 행 추가, exists_on: 마지막 행만 }

  fee_summary_sales:
    type: gray_box
    title: "요금 정보 요약"
    description: "거리별 요금 존재 시 기본판가 + 거리별 요금 최고가의 합산 VAT 포함 금액"
    right_top_template: "기본판가 {N}원 + 거리별 최고가({요금제}) {N}원"
    right_bottom_template: "VAT 포함 최대 {N}원"
    formula: "(기본판가 + 거리별_최고가) * 1.1"

  fee_summary_cost:
    type: gray_box
    title: "요금 정보 요약"
    description: "거리별 요금 존재 시 기본 요금 합계 + 거리별 요금 최고가의 합산 VAT 포함 금액"
    right_top_template: "픽업비 {N}원 + 완료비 {N}원 + 라이더비 {N}원 + 거리별 최고가({요금제}) {N}원"
    right_bottom_template: "VAT 포함 최대 {N}원"
    formula: "(픽업비 + 완료비 + 라이더비 + 거리별_최고가) * 1.1"
    issue: "관제비·관리비가 합계식에서 제외됨. 문구는 '기본 요금 합계' → Q-3"

  zone_select_sales:
    inherits: zone_select_table
    title: "적용 ZONE 선택"
    guide_text: "» ZONE별로 1개의 판가 요금제만 적용 가능합니다. 요금제는 복수의 ZONE에 적용할 수 있습니다."
    issue: "조회 시 행 0개로 표시 (실제 매핑 존재) → B-1"

  zone_select_cost:
    inherits: zone_select_table
    title: "적용 ZONE 선택"
    guide_text: "» ZONE별로 1개의 원가 요금제만 적용 가능합니다. 요금제는 복수의 ZONE에 적용할 수 있습니다."
    issue: "B-1"

  zone_select_extra_fee:
    inherits: zone_select_table
    title: "적용 ZONE 선택"
    guide_text: "» ZONE별로 1개의 원가 요금제만 적용 가능합니다. 요금제는 복수의 ZONE에 적용할 수 있습니다."
    issue: "B-3 복붙 오류 — 할증 화면에 '원가 요금제' 문구. 실제로는 ZONE당 N개 허용"

  zone_select_promotion:
    inherits: zone_select_table
    title: "적용 ZONE 선택"
    guide_text: "» ZONE별로 1개의 판가 요금제만 적용 가능합니다. 요금제는 복수의 ZONE에 적용할 수 있습니다."
    issue: "B-3 복붙 오류 — 프로모션 화면에 '판가 요금제' 문구"

  history_sales:
    title: "이력 정보"
    inherits: history_textarea
    exists_on_create: true
    exists_on_create_issue: "추가 화면에도 빈 섹션 존재"
    actions: [판가 정책 생성, 판가 정책 수정, 판가 구간 생성, 판가 구간 수정, 판가 정책 Zone 추가]

  history_cost:
    title: "이력정보"
    inherits: history_textarea
    actions: [원가 정책 생성, 원가 정책 수정, 원가 구간 생성, 원가 구간 수정, 원가 정책 Zone 추가]

  history_extra_fee:
    title: "이력정보"
    inherits: history_textarea
    actions: [할증 생성]

  history_promotion:
    title: "이력 정보"
    inherits: history_textarea
    actions: [프로모션 생성, 프로모션 Zone 추가, 프로모션 상점 매핑 추가]
    line_format_actual: "[YYYY-MM-DD HH:mm:ss] {액션} (변경유저:{이름}.{소속})"
    issue: "팀 없이 '{이름}.{소속}' 형식 — 다른 메뉴와 불일치"

# --- 할증 전용 --------------------------------------------------
  basic_info_extra_fee:
    title: "기본 정보"
    fields:
      - { name: 할증명, type: text, required: true, placeholder: "할증 제목을 입력하세요." }
      - { name: 할증 적용 일자, type: date_range, required: true,
          placeholders: ["시작일", "종료 안 함"] }
      - { name: 할증 적용 시간, type: time_range, required: false,
          placeholders: ["00:00", "23:59"],
          hidden_when: "할증 종류 == 요일 및 시간대 할증" }
      - { name: 할증 사유, type: text, required: false }
    guide_text: "» 하루 중 할증 적용 시간, 미입력 시 00:00 ~ 23:59 적용됩니다."
    validation:
      - { field: 할증 적용 일자, empty: "✗ 적용 시작일은 필수 입력값입니다." }
      - { field: 할증 적용 시간, valid: "○ 올바른 시간입니다." }

  amount_info_extra_fee:
    title: "금액 정보"
    fields:
      - { name: "판가 할증 금액(VAT 미포함)", type: text, required: false, vat_badge: true, default_on_create: 0 }
      - { name: "원가 할증 금액(VAT 미포함)", type: text, required: false, vat_badge: true, default_on_create: 0 }
    guide_text: "원가 및 판가 할증 금액 중 1개는 반드시 설정해야 합니다."
    guide_position: "두 필드 각각 아래"
    note: "개별 필드에 ● 없으나 둘 중 하나는 조건부 필수"

  extra_fee_setting:
    title: "할증 설정"
    fields:
      - name: 할증 종류
        type: radio
        required: true
        layout: horizontal
        default: "기상 할증"
        options: ["기상 할증", "요일 및 시간대 할증", "지역 폴리곤 할증", "특수 할증"]
    conditional_blocks:
      기상 할증:  { extra_fields: none, issue: "기상 조건 지정 필드 없음 → Q-4" }
      특수 할증:  { extra_fields: none, note: "기상 할증과 화면이 완전히 동일" }
      요일 및 시간대 할증: weekday_time_matrix
      지역 폴리곤 할증:    polygon_setting

  weekday_time_matrix:
    section_badge_on_error: "요일 및 시간대 설정에 올바르지 않은 범위가 포함돼있습니다."
    rows: [월, 화, 수, 목, 금, 토, 일]
    per_row:
      time_ranges: 2
      inputs_per_range: 4     # 시작 HH, MM / 종료 HH, MM
      clear_button: { label: "✕", appears_when: "값 입력 시" }
      bulk_apply: { label: "일괄적용", style: "회색 pill",
                    behavior: "해당 요일 설정을 다른 요일에 복사 (추정)" }
      timeline:
        position: right
        ticks: ["06:00", "12:00", "18:00", "24:00"]
        max_label: "29:59"
        max_meaning: "익일 05:59 — 자정 넘김 구간을 익일 시각으로 표현"
        set_range_style: "파란 선 + 종료시각 텍스트"
    row_validation_messages:
      - { text: "○ 올바른 시간대 설정입니다", style: valid }
      - { text: "✗ 첫 번째 종료 시간이 잘못됐습니다", style: error }
      - { text: "✗ 두 시간대가 겹칩니다", style: error }
    issue: "운영 데이터가 검증 통과 못함 → B-2, Q-11"

  polygon_setting:
    fields:
      - { name: 폴리곤 할증 구분, type: radio, required: true,
          options: [픽업지, 배송지, "픽업/배송지"], default: 픽업지 }
      - name: 픽업지 폴리곤
        type: table
        columns: [폴리곤명, 설명]
        footer: { left: "+ 폴리곤 추가", right: "총 {N}개" }
        badge: "픽업 폴리곤은 최소 1개 이상 최대 5개 이하 선택해주세요."
        modal_trigger: polygon_search
      - { name: (지도), type: naver_map, position: right }
    not_verified: "배송지 / 픽업·배송지 선택 시의 블록 구성"

# --- 프로모션 전용 -----------------------------------------------
  basic_info_promotion:
    title: "기본 정보"
    fields:
      - { name: 프로모션명, type: text, required: true }
      - { name: 프로모션 설명, type: textarea, required: false, placeholder: "100자 이내" }
      - { name: 프로모션 적용 일자, type: date_range, required: true,
          placeholders: ["시작일", "종료 안 함"] }
      - { name: 프로모션 적용 시간, type: time_range, required: false,
          placeholders: ["00:00", "23:59"] }
    guide_text: "» 하루 중 프로모션 적용 시간, 미입력 시 00:00 ~ 23:59 적용됩니다."

  fee_info_promotion:
    title: "요금 정보"
    fields:
      - { name: 프로모션 대분류, type: radio, required: true, options: [상점], default: 상점,
          issue: "B-5 선택지 1개. 기사 옵션 미구현" }
      - { name: "판가 금액 (VAT 미포함)", type: text, required: true, vat_badge: true }

  store_select:
    title: "적용 상점 선택"
    badge_on_create: "적용 상점은 최소 1개 이상 선택해주세요."
    inline_search:
      position: "테이블 위 중앙"
      icon: magnifier
      placeholder: "검색어를 입력하면 즉시 반영됩니다"
    table:
      columns: [상점코드, 상점명, 상점 전화번호, { type: action, label: "삭제" }]
    footer: { left: "+ 상점 추가", right: "총 {N}개" }
    modal_trigger: store_search
    note: "적용 ZONE은 모달만, 적용 상점은 인라인 검색 + 모달 두 방식 공존"

# --- ZONE 관리 --------------------------------------------------
  zone_basic_info_detail:
    title: "기본 정보"
    fields:
      - { name: ZONE 이름, type: text, editable: true }
      - { name: 지점 ID, type: custom_select, disabled: true,
          display_value: "지점명", issue: "라벨은 'ID'인데 표시값은 지점명" }
    validation:
      - { field: ZONE 이름, valid: "올바른 ZONE 이름입니다." }
      - { field: 지점 ID, valid: "올바른 지점 ID입니다." }

  zone_basic_info_create:
    title: "기본 정보"
    fields:
      - { name: ZONE 이름, type: text, required: true, default: "" }
      - { name: 지점 ID, type: custom_select, required: true, default: "선택없음",
          options_ref: branch_options }
    guide_text: "» 벤더존 운영방식의 지점만 매핑 가능합니다. 매핑 후에는 다른 지점으로 교체할 수 없습니다."
    validation:
      - { field: ZONE 이름, empty: "ZONE 이름은 필수 입력값입니다." }
      - { field: 지점 ID, empty: "지점 ID 필수 입력값입니다." }
    issue: "이미 매핑된 지점이 드롭다운에서 걸러지지 않음 → I-2"

  zone_area_info:
    title: "권역 정보"
    fields:
      - { name: 세일즈 권역, type: text, disabled: true, value_format: "지점판매권역_{범위코드}" }
      - { name: 공급 권역, type: text, disabled: true, value_format: "지점공급권역_{범위코드}" }
    note: "지점 선택 시 자동 연결, 이 화면에서 변경 불가"
    sub_blocks: [zone_map_and_areas]

  zone_area_info_empty:
    title: "권역 정보"
    fields:
      - { name: 세일즈 권역, type: text, disabled: true, value: "지점을 선택하세요." }
      - { name: 공급 권역, type: text, disabled: true, value: "지점을 선택하세요." }
    sub_blocks: none
    note: "지점 선택 전에는 지도·권역 목록 미표시"

  zone_map_and_areas:
    layout: "2열 (좌: 지도 / 우: 픽업지 블록 → 배송지 블록 수직)"
    map:
      provider: NAVER
      legend: [{ label: "세일즈 권역", color: 파랑 }, { label: 픽업지, color: 노랑 }, { label: 배송지, color: 보라 }]
      controls: "줌 슬라이더 (+/−)"
      sticky: false
      issue: "I-6 배송지 목록 스크롤 시 지도가 사라지고 좌측이 빈 공간"
    per_block:          # 픽업지 / 배송지 각각
      count_label: "총 {N}개"
      polygon_group_table:
        columns: ["{픽업지|배송지}명"]
        scroll: true
      area_type_radio: { options: [행정동, 법정동], default: 법정동 }
      area_table:
        columns: [지역종류, "{픽업지|배송지}명"]
        actual_cell_value: "행정구역명 (예: 길음동)"
        issue: "B-6 헤더가 잘못됨. '지역명'이 맞음"
        scroll: true
        max_height: fixed

# --- 벤더 관리 --------------------------------------------------
  business_info_detail:
    title: "사업자 정보"
    layout: "3열 그리드"
    fields:
      - { name: 사업자등록번호, required: true, type: text, editable: false, placeholder: "숫자 10자리" }
      - { name: 사업자명(벤더명), required: true, type: text, editable: false, placeholder: "사업자명" }
      - { name: 대표자명, required: true, type: text, editable: false, placeholder: "대표자명" }
      - { name: 연락처, required: true, type: text, editable: true, placeholder: "연락처" }
      - { name: 이메일, required: true, type: text, editable: true, placeholder: "예) sample@mail.com" }
    note: "사업자등록번호·사업자명·대표자명 수정 불가 → Q-6"

  business_info_create:
    inherits: business_info_detail
    all_fields_editable: true

  settlement_info_detail:
    title: "정산 정보"
    layout: "3열"
    fields:
      - { name: 정산 은행, required: true, editable: false }
      - { name: 정산 계좌번호, required: true, editable: false }
      - { name: 정산 예금주, required: true, editable: false }
    issue: "정산 계좌 변경 경로 없음 → Q-6"

  settlement_info_create:
    title: "정산 정보"
    fields:
      - { name: 정산 은행, required: true, type: select, default: "은행명", options_ref: bank_options }
      - { name: 정산 계좌번호, required: true, type: text }
      - { name: 정산 예금주, required: true, type: text }
    validation:
      - "정산 은행은 필수 입력값입니다."
      - "정산 계좌번호는 필수 입력값입니다."
      - "정산 예금주는 필수 입력값입니다."

  contract_info:
    title: "계약 정보"
    layout: "2열"
    fields:
      - { name: 계약 시작일, required: false, type: date, placeholder: "YYYY-MM-DD" }
      - { name: 계약 종료일, required: false, type: date, placeholder: "YYYY-MM-DD" }
    issue: "필수 아님. 만료 알림·목록 컬럼 없음 → I-3, Q-9"

  vendor_zone:
    title: "소속 Zone"
    layout: "2열"
    fields:
      - { name: Zone 이름, type: text, editable: false }
      - { name: 상태, type: text, editable: false, note: "'Zone의 상태'인지 '벤더의 상태'인지 라벨 모호" }
    validation:
      - { field: Zone 이름, valid: "올바른 Zone 이름입니다." }
    exists_on_create: false
    issue: "읽기 전용 + 등록 화면에 없음. 연결 경로 불명 → Q-7 (최우선)"

  vendor_owner:
    title: "벤더장 (VO) 지정 / 해제"
    layout: "3열"
    fields:
      - { name: 벤더장 선택, type: custom_select, editable: true,
          option_format: "{이름} ({연락처})" }
      - { name: 벤더장 연락처, type: text, editable: false }
      - { name: 벤더장 지정일, type: text, editable: false, format: "YYYY-MM-DD HH:mm" }
    guide_texts:
      - "» 벤더 기사로 등록 가능한 기사 중에서만 검색됩니다 (이름 또는 연락처). 타 벤더 VO 기사는 서버에서 선택이 제한됩니다."
      - "» 운영중(ACTIVE) 상태에서는 VO 해제 불가. 교체만 가능합니다. 해제하려면 먼저 INACTIVE로 변경하세요."
    issue: "두 번째 문구에 개발 enum 노출 + INACTIVE가 화면 어디에도 없음 → B-9"

  vendor_owner_create:
    inherits: vendor_owner
    default: "지정 해제"
    guide_texts: "첫 번째만 표시"

  attachments_detail:
    title: "첨부 파일"
    layout: "2열 x 2행"
    items: [사업자등록증, 계약서, 통장 사본, 신분증 사본]
    required: false
    per_item:
      filename_display: "업로드된 파일명 또는 placeholder '· 이미지 파일 선택'"
      filename_format_actual: "난수 문자열 (예: VdC9bu5Pyyg.jpg)"
      buttons:
        - { label: "파일 선택", style: "회색 pill", always: true }
        - { label: "기존 파일 다운로드", style: link, condition: "파일 존재 시만" }
    guide_text: "» PDF·PNG·JPG·JPEG 파일만 업로드할 수 있습니다. 파일 선택 시 즉시 업로드되며, 저장 시 함께 반영됩니다. 기존 파일이 있으면 다운로드 후 새 파일을 선택하면 교체됩니다."
    allowed_extensions: [pdf, png, jpg, jpeg]
    issue: "원본 파일명 유실 → I-5"

  attachments_create:
    inherits: attachments_detail
    state: "4종 전부 빈 상태, 다운로드 버튼 없음"

  rider_register:
    title: "기사 소속 등록"
    fields:
      - { name: 기사 검색, type: custom_select, placeholder: "이름 또는 연락처로 검색" }
      - { name: 소속 등록, type: button, style: "회색 pill", disabled_when: "기사 미선택" }
    guide_text: "» 벤더 기사로 등록 가능한 기사 중에서만 검색됩니다 (이름 또는 연락처). 타 벤더에 이미 소속된 기사는 서버에서 등록이 제한됩니다."

  rider_list:
    title: "소속 기사 · 총 {N}명"
    title_note: "섹션 제목에 인원수 포함"
    table_columns:
      - { name: NO, note: "1부터 순번" }
      - { name: 기사명 }
      - { name: 연락처, format: "하이픈 없는 11자리" }
      - { name: 소속 상태, values: [ACTIVE], issue: "B-9 원문 enum 노출" }
      - { name: 등록일, format: "YYYY-MM-DD" }
      - { type: action, label: "해제", style: "빨간 pill" }

  vendor_change_history:
    table_columns:
      - { name: 일시, format: "YYYY-MM-DD HH:mm" }
      - { name: 수정자, format: "{이름} {직급} {팀}" }
      - { name: 변경 내용, type: 자연어 }
    footer: { center: pagination, right: "총 {N}건" }
    action_types:
      - { action: 벤더 신규 등록, format: "벤더 신규 등록 — {벤더명} (사업자번호: {번호})" }
      - { action: 벤더장 지정,   format: "벤더장 지정 — {이름}" }
      - { action: 상태 변경,     format: "상태 변경 — {before} → {after} · 사유: {사유}",
          issue: "상태값이 '활성'. 목록은 '운영중' → B-11" }
      - { action: 기사 소속 등록, format: "기사 소속 등록 — {이름}" }
      - { action: 존 연결,       format: "존 연결 — {zone_uuid}",
          issue: "B-10 ZONE명 대신 UUID 노출" }

# --- 세트분배 관리 -----------------------------------------------
  set_alloc_basic_info:
    title: "기본 정보"
    fields:
      - { name: Zone 이름, type: text, editable: false }

  vendor_composition:
    title: "벤더 구성"
    add_control:
      position: "섹션 상단 (테이블 밖)"
      type: custom_select
      placeholder: "벤더명 검색"
      filters_already_assigned: true
      filters_terminated: false
      filters_other_zone: false
      issue: "해지 벤더·타 ZONE 소속 벤더가 선택 가능 → I-4"
    table:
      columns:
        - { name: 벤더명 }
        - { name: 상태, values: [운영중, 운영중지] }
        - { name: 할당 세트 수, type: number_inline, style: 밑줄형,
            disabled_when: "상태 == 운영중지" }
        - { type: action, label: "삭제", style: "빨간 pill" }

  set_alloc_change_history:
    table_columns:
      - { name: 버전, format: "v{N}" }
      - { name: 상태, values_confirmed: ["현재 적용", "취소됨"], note: "그 외 값 미확인" }
      - { name: 적용 시작일, format: "YYYY-MM-DD HH:mm:ss" }
      - { name: 메모 }
      - { name: 생성 일시, format: "YYYY-MM-DD HH:mm:ss" }
      - { name: 생성자, format: "{이름} {직급} {팀}" }
      - { name: 관리, note: "과거/취소 = '비교' 버튼 / 현재 = '현재 버전' 텍스트" }
    modal_trigger: set_alloc_version_diff
    issue: "버전 번호가 큰 v2가 취소되고 v1이 현재 적용 → Q-12"

# ===============================================================
# 모달
# ===============================================================
modals:
  zone_search:
    title: "ZONE 검색"
    used_by: [sales_pricing, cost_pricing, extra_fee, promotion]
    trigger: "적용 ZONE 선택 섹션의 [+ ZONE 추가]"
    screenshots: ["10_판가_zone검색모달_초기.png", "11_판가_zone검색모달_결과6건.png"]
    body:
      - { name: ZONE명, type: text, placeholder: "ZONE명으로 검색" }
      - { name: (검색), type: icon_button, icon: magnifier, align: right }
      - { type: text, template: "검색 결과 ( {N} )" }
      - { type: table, columns: ["ZONE ID", "ZONE명"], row_click: select }
      - type: pagination
    empty_state:
      primary: "조건을 선택해 검색해주세요"
      secondary: "검색 결과가 이곳에 표시됩니다."
    selected_area:
      title: "현재 선택된 ZONE"
      empty_text: "현재 선택된 ZONE이 없습니다."
    buttons:
      - { label: "닫기", style: secondary }
      - { label: "선택", style: primary }
    behavior:
      autoload_on_open: false
      autoload_issue: "ZONE 권역정책 관리의 동일 모달은 자동 조회됨 → 동일 컴포넌트인데 동작 다름"
      filters_already_linked: false
      filters_issue: "I-4"

  polygon_search:
    title: "ZONE 할증 폴리곤 검색"
    used_by: [extra_fee]
    trigger: "지역 폴리곤 할증 > [+ 폴리곤 추가]"
    screenshots: ["21_할증_폴리곤검색모달.png"]
    header_right: { type: external_link, label: "? ZONE 할증 폴리곤 편집기 ↗", target: new_tab }
    body:
      - { type: text_input_with_search }
      - { type: text, value: "검색 결과: 전체" }
      - { type: card_list, card_lines: [폴리곤명, 설명] }
      - { type: naver_map, position: right, scale: "500m" }
      - type: pagination
    selected_area: { title: "현재 선택된 폴리곤" }
    buttons:
      - { label: "취소", style: secondary }
      - { label: "입력", style: primary }
    buttons_issue: "다른 모달은 '닫기'/'선택' — 라벨 불일치"

  store_search:
    title: "상점 추가"
    used_by: [promotion]
    trigger: "적용 상점 선택 > [+ 상점 추가]"
    screenshots: ["25_프로모션_상점검색모달.png"]
    tabs:
      - { id: search, label: "검색", default: true }
      - { id: by_code, label: "코드로 추가", verified: false }
      - { id: by_excel, label: "엑셀로 추가", verified: false }
    tab_search_fields:
      - { name: 상점 운영 상태, type: checkbox_group, options: [비활성화, 운영중, 운영중지], default: "전부 체크" }
      - { name: 프랜차이즈, type: select, default: 전체 }
      - { name: 프랜차이즈 유형, type: radio, options: [전체, 직영, 가맹], default: 전체 }
      - { name: 검색 조건, type: select, default: 상점명 }
      - { name: 검색어, type: text, placeholder: "검색어" }
      - { name: 관리구분, type: select, default: 전체 }
      - { name: 영업구분, type: select, default: 전체 }
      - { name: 관제 지점, type: select, default: 전체 }
      - { name: 상점 주소, type: text, placeholder: "상점주소" }
      - { name: 태그, type: text, placeholder: "최대 8개" }
      - { name: (검색), type: icon_button, align: right }
    result:
      header: "검색 결과"
      columns: [상점명, 상점 전화번호]
      columns_issue: "상점코드 없음 (본문 테이블에는 있음) → I-8"
      empty_state:
        primary: "조건을 입력하여 검색해주세요."
        secondary: "검색 결과가 이곳에 표시됩니다."
    selected_area:
      title: "현재 선택된 상점"
      empty_text: "현재 선택된 상점이 없습니다."
    buttons:
      - { label: "취소", style: secondary }
      - { label: "선택", style: primary }

  set_alloc_version_diff:
    title: "세트분배 버전 비교 — v{A} → v{B}"
    used_by: [set_allocation]
    trigger: "변경 이력 탭의 [비교] 버튼"
    screenshots: ["34_세트분배_버전비교모달.png"]
    column_headers: ["선택 버전", "현재 적용"]
    blocks:
      - { title: "버전 정보", rows: [상태, 적용 시작일, 메모] }
      - title: "벤더별 세트 분배 (변경된 행만 강조)"
        columns: [벤더명, 선택 버전 세트, 현재 적용 세트, 변경]
        change_values_confirmed: [동일]
        change_values_note: "증감·추가·삭제 표기 미확인 → Q-12"
    buttons:
      - { label: "닫기", style: secondary }

# ===============================================================
# 데이터 모델 (화면에서 역추론)
# ===============================================================
data_model:
  Zone:
    id: { type: int, source: "URL path param" }
    uuid: { type: uuid, note: "세트분배 URL·필터 파라미터에 사용" }
    name: { type: string, required: true }
    branchId: { type: int, required: true, immutable_after_create: true,
                constraint: "벤더존 운영방식 지점만, 1:1" }
    salesArea: { type: string, readonly: true, format: "지점판매권역_{코드}" }
    supplyArea: { type: string, readonly: true, format: "지점공급권역_{코드}" }
    pickupPolygons: { type: "PolygonGroup[]" }
    deliveryPolygons: { type: "PolygonGroup[]" }
    createdBy: { type: string }
    # status 필드 없음

  SalesPricing:
    id: { type: int }
    code: { type: string, format: "YYYYMM-SP###" }
    name: { type: string, required: true }
    description: { type: string, maxlength: 100 }
    basePrice: { type: int, unit: 원, vat_excluded: true, range: "1 ~ 100000" }
    distanceFees: { type: "DistanceFee[]" }
    status: { type: enum, values: [활성, 비활성], editable_in_ui: false }
    zones: { type: "Zone[]", cardinality: "1:N (ZONE 입장에서는 1:1)" }
    history: { type: "string[]" }

  CostPricing:
    id: { type: int }
    code: { type: string, format: "YYYYMM-CS###" }
    name: { type: string, required: true }
    description: { type: string, maxlength: 100 }
    controlFee: { type: int, unit: 원 }        # 관제비
    managementFee: { type: int, unit: 원 }     # 관리비
    pickupFee: { type: int, unit: 원 }         # 픽업비
