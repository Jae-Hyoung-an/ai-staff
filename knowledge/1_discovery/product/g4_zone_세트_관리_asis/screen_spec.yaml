    url: "/zone/sales-pricings/{id}"
    create_url: "/zone/sales-pricings/new"
    breadcrumb: ["G4 요금 상품 관리", "ZONE 판가 요금제 관리", "ZONE 판가 요금제 조회"]
    breadcrumb_issue: "추가 화면도 breadcrumb/H1이 '조회'. 추가 시 제목이 'ZONE 판가 요금제 조회 -' → B-7 관련"
