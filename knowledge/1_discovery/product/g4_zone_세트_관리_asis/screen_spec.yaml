# G4 요금 상품 · ZONE 관리 · 세트 관리 — 화면 명세 (구조화 데이터)
# 목적: 목업 자동 생성 / 코드 작성 시 기계 판독용
# 조사일: 2026-07-29 / 환경: 운영 intra-lite.vroong.com
# 서술형 설명은 01_g4_요금상품_화면명세.md, 02_zone_벤더_세트분배_화면명세.md 참조
# 이슈 코드(B-1, I-2, Q-7 등)는 03_개선포인트_및_확인필요사항.md 참조

meta:
  surveyed_at: 2026-07-29
  surveyed_by: "@jaehyoung.an"
  environment: production
  base_url: "https://intra-lite.vroong.com"
  theme: dark
  menus_covered:
    - "G4 요금 상품 관리 > ZONE 판가 요금제 관리"
    - "G4 요금 상품 관리 > ZONE 원가 요금제 관리"
    - "G4 요금 상품 관리 > ZONE 할증 관리"
    - "G4 요금 상품 관리 > G4 프로모션 관리"
    - "영업 관리 > ZONE 관리"
    - "세트 관리 > 벤더 관리"
    - "세트 관리 > 세트분배 관리"
  menus_excluded:
    - path: "G4 요금 상품 관리 > ZONE 할증 폴리곤 편집기"
      reason: "요청 범위 외"
  related_doc:
    - "knowledge/1_discovery/product/zone_권역정책_관리_asis/  # 세트 관리 3번째 메뉴, 별도 문서"

  # 주의: 운영 데이터 보호를 위해 미실행
  not_verified:
    - 저장 / 예약 저장 / 삭제 / 해지 / 운영 중지 동작
    - 벤더 ↔ ZONE 연결 경로 (Q-7)
    - 벤더 상태 전이 규칙 (Q-8)
    - 할증 지역 폴리곤의 배송지 블록 (픽업지만 확인)
    - 상점 검색 모달의 "코드로 추가" / "엑셀로 추가" 탭
    - 세트분배 예약 저장의 적용 시작일 입력 UI
    - 권한별 화면 차이 (PO팀 계정 1개로만 조사)

# ---------------------------------------------------------------
# 공통 규격
# ---------------------------------------------------------------
common:
  colors:
    section_title: "파랑"
    required_marker: "주황"
    reset_button: "분홍/빨강 계열"
    delete_button: "빨강"
    vat_badge: "초록 테두리 pill"
    error: "빨강"
    valid: "초록"

  layout:
    sidebar: { collapsible: true }
    body_scroll: "본문 내부 스크롤 컨테이너 (하단 버튼 바 고정)"
    section_divider: "가로 구분선"
    header_right_list: [{ type: button, label: "초기화" }]
    header_right_form: [{ type: text, value: "● 필수 입력 사항" }]

  required_marker: "●"
  helper_text_pattern: "올바른 {필드명}입니다."
  required_error_pattern: "{필드명}은 필수 입력값입니다."
  guide_text_prefix: "»"

  components:
    vat_badge:
      position: "금액 입력창 오른쪽"
      template: "VAT포함 {N}원"
      calc: "입력값 * 1.1"
      realtime: true

    custom_select:
      note: "네이티브 <select> 아님. 검색어 입력창이 붙은 리스트"
      search_input_label: "검색어"

    history_textarea:
      used_by: [sales_pricing, cost_pricing, extra_fee, promotion]
      type: textarea
      disabled: true
      readonly: true
      line_format: "[YYYY-MM-DD HH:mm:ss] {액션} (변경유저:{이름}  {팀})"
      note: "이름과 팀 사이 공백 2칸. 프로모션(외주계정)은 '{이름}.{소속}' 형식 — 표기 불일치"

    history_table:
      used_by: [vendor, set_allocation]
      note: "벤더/세트분배는 textarea가 아니라 테이블 + 페이지네이션 정식 감사 로그"

    zone_select_table:
      columns: ["#", "ZONE명", { type: action, label: "삭제" }]
      footer: { left: "+ ZONE 추가", center: pagination, right: "총 {N}개" }
      modal_trigger: zone_search

    date_range:
      structure: "[시작일] → [종료 안 함] + 캘린더 아이콘 각각"
      empty_end_means: 무기한

# ---------------------------------------------------------------
# URL 규칙
# ---------------------------------------------------------------
url_conventions:
  list_to_create:
    new: [sales_pricing, cost_pricing, extra_fee, promotion, zone]
    add: [vendor, operation_policy]     # operation_policy는 별도 문서
    none: [set_allocation]              # ZONE 종속으로 자동 생성
    issue: "생성 경로가 new/add 두 종류로 갈림 → B-8"
  detail_identifier:
    numeric_id: [sales_pricing, cost_pricing, extra_fee, promotion, zone, vendor]
    uuid: [set_allocation]
    issue: "식별자 체계 불일치"
  zone_filter_param:
    zoneUuid: [sales_pricing, cost_pricing, extra_fee, promotion, vendor]
    zoneName: [set_allocation]
    issue: "세트분배만 이름 기반"

code_formats:
  sales_pricing: "YYYYMM-SP###"     # SP = Sales Pricing
  cost_pricing:  "YYYYMM-CS###"     # CS = Cost Pricing
  extra_fee:     "YYYYMM-SC###"     # SC = SurCharge
  promotion:     "YYYYMM-PM###"     # PM = ProMotion
  zone:          "숫자 (코드 체계 없음)"
  vendor:        "숫자 (벤더 코드)"

# ---------------------------------------------------------------
# 4개 G4 메뉴 공통 섹션 구조
# ---------------------------------------------------------------
g4_section_order:
  sales_pricing: [기본 정보, 요금 정보, 적용 ZONE 선택, 이력 정보]
  cost_pricing:  [기본 정보, 요금 정보, 적용 ZONE 선택, 이력정보]
  extra_fee:     [기본 정보, 금액 정보, 할증 설정, 적용 ZONE 선택, 이력정보]
  promotion:     [기본 정보, 적용 ZONE 선택, 요금 정보, 적용 상점 선택, 이력 정보]
  issues:
    - "섹션 제목이 '이력 정보'(판가·프로모션) / '이력정보'(원가·할증)로 갈림"
    - "프로모션만 적용 ZONE이 2번째 → 섹션 순서 불일치"

